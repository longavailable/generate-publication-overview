name: Collect Meixiu Yu's publications

# 采集已改为本地定期运行（见 mongodb/001-googleScholar2mongodb.py）。
# GitHub 托管 runner 的 IP 段早已被 Google 识别，日志显示作者主页请求连续 403，
# 跑满重试只会白等 7 分钟然后失败，所以这里不再设定时任务。
# 保留本workflow 仅供必要时手动触发排查，日常流程请走本地脚本。

on:
  workflow_dispatch:

jobs:
  collect:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:

      - name: checkout repo content
        uses: actions/checkout@v6

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 依赖漂移是本项目最容易复现的故障（scholarly 未锁 bibtexparser 上界），
          # 在真正抓取前先确认关键模块能导入，避免白等几十分钟才报错。
          python -c "import scholarly; print('scholarly', scholarly.__name__, 'import OK')"

      - name: execute python script 001
        env:
          MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
          MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
        run: python mongodb/001-googleScholar2mongodb.py